[project]
name = "trendsentinel-scraper"
version = "0.1.0"
description = "Data collection for the TrendSentinel project: collection, normalization, validation, storage and monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "beautifulsoup4>=4.12,<5",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "respx>=0.21,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendsentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Illustrative code blocks inside the docs are not part of the codebase.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
]
ignore = [
    "SIM108",  # ternary is not always clearer than if/else
]

[tool.ruff.lint.isort]
known-first-party = ["trendsentinel", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["feedparser.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both fixtures and tests must share one event loop. A connection pool opens background
# tasks in the loop that created it; if a test ran in a different loop, a second concurrent
# connection would wait forever on an event signalled by a task in another loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL test database",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/trendsentinel"]
branch = true