# Alembic configuration.
#
# Alembic is used as a migration *runner*, not an autogenerate tool: the schema is authored
# as explicit native SQL in `migrations/versions/`. The database URL is not stored here, it
# is read from the application settings in `migrations/env.py`.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped revision files keep the versions directory readable in chronological order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S